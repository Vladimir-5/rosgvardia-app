<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Росгвардия — мои горизонты</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f1e8; }
      iframe { width: 100%; height: 100%; border: none; display: block; }
      #loader {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center; font-family: sans-serif; color: #880000;
      }
      #loader .logo { font-size: 3rem; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="logo">⚜️</div>
      <div>Загрузка...</div>
    </div>
    <iframe id="appFrame" src="http://10.0.2.2:3000"
            onload="document.getElementById('loader').style.display='none'">
    </iframe>
  </body>
</html>
